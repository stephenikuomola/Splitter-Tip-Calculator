<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A nice to have tip calculator" />

    <!-- Favicon  -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graphs  -->

    <!-- CSS Links -->
    <link rel="stylesheet" href="src/splitter.css" />

    <!-- JavaScript Links -->
    <script src="src/splitter.js" type="module"></script>

    <!-- Title -->
    <title>Splitter</title>
  </head>
  <body>
    <main id="app">
      <header>
        <!--
         TODO 
         Do not forget to add the link to the page when deployed in Netlify
        -->
        <a class="logo" href="#">
          <img
            class="logo_img"
            alt="The tip calculator logo"
            src="./assets/images/logo.svg"
          />
        </a>
      </header>
      <section
        class="calcultor-interface"
        aria-labelledby="tip-calculator-interface"
      >
        <h1 class="sr-only" id="tip-calculator-interface">
          The Tip Calculator Interface
        </h1>
        <form>
          <div class="bill-wrapper"></div>
          <fieldset>
            <legend>Select Tip %</legend>
          </fieldset>
          <div class="number-of-people-wrapper"></div>
          <div class="results-wrapper"></div>
        </form>
      </section>
    </main>
  </body>
</html>
